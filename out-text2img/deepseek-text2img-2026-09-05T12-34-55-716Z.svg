<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e00"/>
      <stop offset="0.3" stop-color="#ff6a00"/>
      <stop offset="0.6" stop-color="#e1306c"/>
      <stop offset="0.85" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#4a0080"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9944"/>
      <stop offset="0.3" stop-color="#ff5544"/>
      <stop offset="0.7" stop-color="#1a1a5e"/>
      <stop offset="1" stop-color="#0a0a2e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffdd55" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 天空 -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>
  <!-- 太阳光晕 -->
  <circle cx="400" cy="260" r="120" fill="url(#sunGlow)"/>
  <!-- 太阳 -->
  <circle cx="400" cy="260" r="55" fill="#ffcc00"/>
  <circle cx="400" cy="260" r="55" fill="#ff8800" opacity="0.4"/>
  <!-- 海平面 -->
  <rect y="270" width="800" height="180" fill="url(#seaGrad)"/>
  <!-- 海面反光 -->
  <ellipse cx="400" cy="270" rx="100" ry="6" fill="#ffdd88" opacity="0.8"/>
  <rect x="320" y="275" width="160" height="2" fill="#ffcc44" opacity="0.9"/>
  <rect x="360" y="285" width="80" height="2" fill="#ff8844" opacity="0.7"/>
  <rect x="310" y="295" width="180" height="2" fill="#ff6622" opacity="0.5"/>
  <rect x="380" y="305" width="40" height="2" fill="#ff4400" opacity="0.4"/>
  <rect x="280" y="320" width="240" height="2" fill="#ff6622" opacity="0.35"/>
  <rect x="350" y="340" width="100" height="2" fill="#ff4400" opacity="0.3"/>
  <rect x="260" y="360" width="280" height="2" fill="#cc4400" opacity="0.25"/>
  <!-- 云彩 -->
  <path d="M100 120 Q180 100 260 130 Q300 140 350 120" stroke="#ffaa66" stroke-width="6" fill="none" opacity="0.3"/>
  <path d="M550 100 Q620 90 680 110 Q720 120 760 105" stroke="#ffaa66" stroke-width="5" fill="none" opacity="0.3"/>
</svg>